spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  issuer: book-rental-api
  audience: book-rental-api
  access-token-ttl: 15m

logging:
  level:
    org.springframework.security: TRACE
